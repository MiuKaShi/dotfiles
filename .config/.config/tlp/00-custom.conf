TLP_ENABLE=1
TLP_AUTO_SWITCH=1
TLP_PROFILE_AC=PRF
TLP_PROFILE_BAT=SAV

# ============================================
# PCIe ASPM
# ============================================

PCIE_ASPM_ON_AC=default
PCIE_ASPM_ON_BAT=powersupersave

# ============================================
# CPU Scaling Governor
# For Intel intel_pstate active mode
# ============================================

CPU_SCALING_GOVERNOR_ON_PRF=performance
CPU_SCALING_GOVERNOR_ON_BAL=powersave
CPU_SCALING_GOVERNOR_ON_SAV=powersave

# ============================================
# CPU Energy Performance Policy
# ============================================

CPU_ENERGY_PERF_POLICY_ON_PRF=performance
CPU_ENERGY_PERF_POLICY_ON_BAL=balance_power
CPU_ENERGY_PERF_POLICY_ON_SAV=power

# ============================================
# CPU Turbo Boost
# ============================================

CPU_BOOST_ON_PRF=1
CPU_BOOST_ON_BAL=0
CPU_BOOST_ON_SAV=0

CPU_HWP_DYN_BOOST_ON_PRF=1
CPU_HWP_DYN_BOOST_ON_BAL=0
CPU_HWP_DYN_BOOST_ON_SAV=0

# ============================================
# Platform Profile
# Enable only if supported by hardware
# ============================================

#PLATFORM_PROFILE_ON_PRF=performance
#PLATFORM_PROFILE_ON_BAL=balanced
#PLATFORM_PROFILE_ON_SAV=low-power


# ============================================
# Wi-Fi Power Management
# ============================================

WIFI_PWR_ON_PRF=off
WIFI_PWR_ON_BAL=on
WIFI_PWR_ON_SAV=on


# ============================================
# PCIe Runtime Power Management
# ============================================

RUNTIME_PM_ON_PRF=auto
RUNTIME_PM_ON_BAL=auto
RUNTIME_PM_ON_SAV=auto


# ============================================
# Radio Devices
# ============================================

DEVICES_TO_ENABLE_ON_STARTUP="bluetooth wifi"
DEVICES_TO_DISABLE_ON_STARTUP="nfc wwan"
DEVICES_TO_DISABLE_ON_SHUTDOWN="nfc wwan"

DEVICES_TO_DISABLE_ON_BAT_NOT_IN_USE="bluetooth nfc wwan"


# ============================================
# Battery Charge Thresholds
# ============================================

START_CHARGE_THRESH_BAT0=80
STOP_CHARGE_THRESH_BAT0=90

